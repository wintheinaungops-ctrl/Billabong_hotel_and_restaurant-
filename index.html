<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billabong Hotel and Restaurant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 24px;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .gallery-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            justify-content: center;
        }
        .gallery-grid img {
            width: 31%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .map-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .map-link {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            transition: background-color 0.2s ease;
        }
        .map-link:hover {
            background-color: #1d4ed8;
        }
        .bottom-image img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ဆိုင်အမည် -->
        <h1>Billabong Hotel and Restaurant</h1>

        <!-- ဆိုင်ဓာတ်ပုံ ၃ ပုံ -->
        <div class="gallery-grid">
            <!-- မိမိ၏ ဆိုင်ဓာတ်ပုံ URL များကို ဤနေရာတွင် အစားထိုးပါ -->
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=400&q=80" alt="Billabong Hotel Photo 1">
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=400&q=80" alt="Billabong Restaurant Photo 2">
            <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=400&q=80" alt="Billabong Food Photo 3">
        </div>

        <!-- Google Map Link နှင့် အောက်ဘက်ဓာတ်ပုံ -->
        <div class="map-section">
            <p style="margin-bottom: 12px; font-weight: bold; color: #4b5563;"> Get location here!</p>
            
           
            <a href=" https://maps.app.goo.gl/7vqJpUpMzJJCteRp9?g_st=ac" target="_blank" class="map-link">
                📍 Open in Google Maps
            </a>

            <!-- Map Link အောက်မှ ဓာတ်ပုံ ၁ ပုံ -->
            <div class="bottom-image">
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80" alt="Location Map Preview">
            </div>
        </div>
    </div>

</body>
</html>
